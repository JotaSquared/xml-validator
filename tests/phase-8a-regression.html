<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase 8A.1A Regression Suite</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #172033; }
    h1 { margin-bottom: 0.25rem; }
    .summary { display: grid; gap: 0.5rem; margin: 1.5rem 0; }
    .summary-line { padding: 0.75rem; border-radius: 0.4rem; background: #eef2f7; font-weight: 700; }
    .pass { color: #087443; }
    .fail { color: #b42318; }
    ol { padding-left: 1.5rem; }
    li { margin: 0.35rem 0; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Phase 8A.1A Regression Suite</h1>
    <p>Exercises the production parser, analyzer, rule engine, rule registry, and reference catalog.</p>
    <div id="suite_status" role="status">Running...</div>
    <section id="aggregate_output" class="summary" aria-label="Aggregate results"></section>
    <section>
      <h2>Individual results</h2>
      <ol id="test_results"></ol>
    </section>
  </main>

  <!-- Production modules: keep this order aligned with index.html. -->
  <script src="../js/utils.js"></script>
  <script src="../js/templateCatalog.js"></script>
  <script src="../data/templates.js"></script>
  <script src="../js/xmlParser.js"></script>
  <script src="../js/xmlAnalyzer.js"></script>
  <script src="../js/ruleEngine.js"></script>
  <script src="../js/validationRules.js"></script>
  <script src="phase-8a-regression.js"></script>
</body>
</html>
